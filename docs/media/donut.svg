<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3B38"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="660" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="200" fill="#FF6B35" opacity="0.14"/>
  <circle cx="60" cy="640" r="150" fill="#FFFFFF" opacity="0.05"/>

  <!-- Left: the gesture -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="90" y="210" font-size="76" font-weight="700" fill="#FFFFFF">Drag. Drop.</text>
    <text x="90" y="296" font-size="76" font-weight="700" fill="#FFB599">Morphed.</text>
    <rect x="90" y="350" width="118" height="66" rx="14" fill="#FFFFFF"/>
    <rect x="90" y="410" width="118" height="8" rx="4" fill="#000000" opacity="0.18"/>
    <text x="149" y="396" font-size="36" font-weight="700" fill="#0B3B38" text-anchor="middle">Ctrl</text>
    <text x="232" y="396" font-size="38" font-weight="600" fill="#FFFFFF">+ drag + drop</text>
    <text x="90" y="472" font-size="24" fill="#FFFFFF" opacity="0.85">Option on macOS.</text>
    <text x="90" y="508" font-size="24" fill="#FFFFFF" opacity="0.85">Only formats that fit the file appear.</text>
    <text x="90" y="544" font-size="24" fill="#FFFFFF" opacity="0.85">The result is saved next to the original.</text>
  </g>

  <!-- Right: the donut. Each segment is a 56 degree arc of a circle (r 170, circumference 1068.14). -->
  <g fill="none" stroke-width="120">
    <circle cx="900" cy="330" r="170" stroke="#FF6B35" stroke-dasharray="166.15 1068.14" transform="rotate(-88 900 330)"/>
    <circle cx="900" cy="330" r="170" stroke="#F1F7F6" stroke-dasharray="166.15 1068.14" transform="rotate(-28 900 330)"/>
    <circle cx="900" cy="330" r="170" stroke="#F1F7F6" stroke-dasharray="166.15 1068.14" transform="rotate(32 900 330)"/>
    <circle cx="900" cy="330" r="170" stroke="#F1F7F6" stroke-dasharray="166.15 1068.14" transform="rotate(92 900 330)"/>
    <circle cx="900" cy="330" r="170" stroke="#F1F7F6" stroke-dasharray="166.15 1068.14" transform="rotate(152 900 330)"/>
    <circle cx="900" cy="330" r="170" stroke="#F1F7F6" stroke-dasharray="166.15 1068.14" transform="rotate(212 900 330)"/>
  </g>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="985" y="193" fill="#FFFFFF">PDF</text>
    <text x="1070" y="340" fill="#0B3B38">DOCX</text>
    <text x="985" y="487" fill="#0B3B38">JPG</text>
    <text x="815" y="487" fill="#0B3B38">PNG</text>
    <text x="730" y="340" fill="#0B3B38">TXT</text>
    <text x="815" y="193" fill="#0B3B38">ZIP</text>
  </g>

  <!-- The file being dropped on PDF, with the cursor -->
  <g transform="translate(1004 214)">
    <path d="M0 8 a8 8 0 0 1 8 -8 h34 l18 18 v56 a8 8 0 0 1 -8 8 h-44 a8 8 0 0 1 -8 -8 z" fill="#2F7DE1" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M42 0 v18 h18 z" fill="#BFD8F7"/>
    <text x="30" y="58" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">DOCX</text>
  </g>
  <path transform="translate(998 200) scale(1.3)" d="M0 0 L0 34 L9 26 L15 40 L21 37 L15 24 L27 24 Z" fill="#FFFFFF" stroke="#0B3B38" stroke-width="2" stroke-linejoin="round"/>
</svg>
